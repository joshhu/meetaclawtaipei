services:
  gemma4:
    image: vllm-node:latest
    container_name: vllm-gemma4
    runtime: nvidia
    ipc: host
    network_mode: host
    volumes:
      - /home/joshhu/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=0
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - vllm
      - serve
      - nvidia/Gemma-4-31B-IT-NVFP4
      - --port=8001
      - --host=0.0.0.0
      - --served-model-name=gemma4
      - --gpu-memory-utilization=0.40
      - --max-model-len=8192
      - --max-num-seqs=4
      - --max-num-batched-tokens=4096
      - --kv-cache-dtype=fp8
      - --enable-auto-tool-choice
      - --tool-call-parser=pythonic
      - --trust-remote-code
    restart: "no"

  qwen36:
    image: vllm-node:latest
    container_name: vllm-qwen36
    runtime: nvidia
    ipc: host
    network_mode: host
    volumes:
      - /home/joshhu/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=0
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - vllm
      - serve
      - mmangkad/Qwen3.6-27B-NVFP4
      - --port=8002
      - --host=0.0.0.0
      - --served-model-name=qwen36
      - --gpu-memory-utilization=0.30
      - --max-model-len=8192
      - --max-num-seqs=4
      - --max-num-batched-tokens=4096
      - --kv-cache-dtype=fp8
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --trust-remote-code
    restart: "no"

  nemotron:
    image: vllm-node:latest
    container_name: vllm-nemotron
    runtime: nvidia
    ipc: host
    network_mode: host
    volumes:
      - /home/joshhu/.cache/huggingface:/root/.cache/huggingface
      - /home/joshhu/workspace/meetaclawtaipei/nano_v3_reasoning_parser.py:/opt/parsers/nano_v3_reasoning_parser.py:ro
    environment:
      - HF_HUB_OFFLINE=0
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_USE_FLASHINFER_MOE_FP4=1
      - VLLM_FLASHINFER_MOE_BACKEND=throughput
    command:
      - vllm
      - serve
      - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      - --port=8003
      - --host=0.0.0.0
      - --served-model-name=nemotron
      - --gpu-memory-utilization=0.25
      - --max-model-len=8192
      - --max-num-seqs=4
      - --max-num-batched-tokens=4096
      - --kv-cache-dtype=fp8
      - --enable-auto-tool-choice
      - --tool-call-parser=pythonic
      - --reasoning-parser-plugin=/opt/parsers/nano_v3_reasoning_parser.py
      - --reasoning-parser=nano_v3
      - --trust-remote-code
    restart: "no"

  # NOTE: deepseek-r1 為可選第 4 個服務；實測 128GB UMA 只能穩定跑 3 個 28B 級模型，
  # 同時啟動 4 個會 OOM。要用時請先停掉其中 1 個（如 nemotron）。
  deepseek-r1:
    image: vllm-node:latest
    container_name: vllm-deepseek-r1
    runtime: nvidia
    ipc: host
    network_mode: host
    profiles: ["optional"]   # 預設不啟動；用 `docker compose --profile optional up -d deepseek-r1`
    volumes:
      - /home/joshhu/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=0
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - vllm
      - serve
      - nm-testing/DeepSeek-R1-Distill-Qwen-32B-NVFP4
      - --port=8004
      - --host=0.0.0.0
      - --served-model-name=deepseek-r1
      - --gpu-memory-utilization=0.30
      - --max-model-len=8192
      - --max-num-seqs=4
      - --max-num-batched-tokens=4096
      - --kv-cache-dtype=fp8
      - --reasoning-parser=deepseek_r1
      - --trust-remote-code
    restart: "no"
