<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>室友三人組 - DGX Spark 多 LLM 互動</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    padding: 12px 24px;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  header h1 {
    font-size: 18px;
    font-weight: 500;
  }

  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #aaa;
  }
  .conn .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #888;
    transition: background .3s;
  }
  .conn.up .dot { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
  .conn.down .dot { background: #f44336; }

  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 50px);
  }

  /* ---- 房間 ---- */
  .room {
    position: relative;
    background:
      linear-gradient(180deg, #f4e4c1 0%, #f4e4c1 55%, #c8a878 55%, #c8a878 100%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
    min-height: 500px;
  }
  /* 牆面裝飾（家具用 emoji 絕對定位） */
  .room::before {
    /* 窗戶 */
    content: "🪟";
    position: absolute;
    top: 6%;
    left: 8%;
    font-size: 80px;
    text-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .room::after {
    content: "🖼️";
    position: absolute;
    top: 8%;
    right: 12%;
    font-size: 60px;
  }
  .furniture {
    position: absolute;
    font-size: 56px;
    text-shadow: 0 2px 4px rgba(0,0,0,.15);
    user-select: none;
  }
  .couch { bottom: 28%; left: 50%; transform: translateX(-50%); font-size: 110px; }
  .lamp  { top: 22%; right: 6%; font-size: 50px; }
  .plant { bottom: 6%; right: 8%; font-size: 56px; }
  .table { bottom: 8%; left: 18%; font-size: 52px; }
  .coffee { bottom: 13%; left: 24%; font-size: 28px; }

  /* ---- 角色 ---- */
  .avatar {
    position: absolute;
    width: 110px;
    text-align: center;
    user-select: none;
    transition: transform .3s;
  }
  .avatar .face {
    font-size: 64px;
    display: inline-block;
    transition: transform .3s, filter .3s;
    filter: grayscale(40%) brightness(0.85);
  }
  .avatar.thinking .face {
    animation: bob 1.6s ease-in-out infinite;
  }
  .avatar.speaking .face {
    filter: none;
    transform: scale(1.18);
    animation: shake .4s ease-in-out 2;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes shake {
    0%, 100% { transform: scale(1.18) rotate(0); }
    25% { transform: scale(1.18) rotate(-3deg); }
    75% { transform: scale(1.18) rotate(3deg); }
  }
  .avatar .name {
    margin-top: 4px;
    font-size: 13px;
    color: #4a2d1c;
    font-weight: 600;
    background: rgba(255,255,255,.7);
    border-radius: 10px;
    padding: 2px 8px;
    display: inline-block;
  }
  .avatar .status {
    font-size: 18px;
    margin-top: 2px;
    opacity: 0;
    transition: opacity .3s;
  }
  .avatar.thinking .status { opacity: 1; }

  /* 房間位置 */
  #ag-Alex  { top: 30%; left: 18%; }
  #ag-Bella { top: 26%; left: 50%; transform: translateX(-50%); }
  #ag-Carl  { top: 30%; right: 18%; }

  /* ---- speech bubble ---- */
  .bubble {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translate(-50%, -100%);
    min-width: 140px;
    max-width: 260px;
    background: #fff;
    color: #222;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 10;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble::after {
    /* 下方小尖角 */
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #fff;
  }
  .avatar.speaking .bubble { opacity: 1; }

  /* ---- 右側面板 ---- */
  aside {
    background: #25253b;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  aside h2 {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #aaa;
    background: rgba(0,0,0,.2);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  #log .entry {
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeIn .4s forwards;
  }
  #log .entry .who {
    font-weight: 600;
    margin-right: 6px;
  }
  #log .entry .meta {
    color: #666;
    font-size: 11px;
    margin-left: 6px;
  }
  #log .entry .text {
    color: #ddd;
    margin-top: 2px;
  }
  .who-Alex  { color: #b39ddb; }
  .who-Bella { color: #ffb74d; }
  .who-Carl  { color: #81c784; }
  .who-system { color: #f44336; }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  footer {
    padding: 8px 16px;
    background: rgba(0,0,0,.2);
    border-top: 1px solid rgba(255,255,255,.06);
    font-size: 11px;
    color: #888;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .room { min-height: 400px; }
  }
</style>
</head>
<body>

<header>
  <h1>🏠 室友三人組 — DGX Spark 多 LLM 即時互動</h1>
  <div class="conn down" id="conn"><span class="dot"></span><span id="conn-text">連線中…</span></div>
</header>

<main>
  <section class="room" id="room">
    <!-- 家具 -->
    <div class="furniture couch">🛋️</div>
    <div class="furniture lamp">💡</div>
    <div class="furniture plant">🌿</div>
    <div class="furniture table">🪑</div>
    <div class="furniture coffee">☕</div>

    <!-- 角色（會由 JS 加 thinking/speaking class） -->
    <div class="avatar" id="ag-Alex">
      <div class="bubble" id="bubble-Alex"></div>
      <div class="face">🤔</div>
      <div class="name">Alex</div>
      <div class="status">💭</div>
    </div>
    <div class="avatar" id="ag-Bella">
      <div class="bubble" id="bubble-Bella"></div>
      <div class="face">😊</div>
      <div class="name">Bella</div>
      <div class="status">💭</div>
    </div>
    <div class="avatar" id="ag-Carl">
      <div class="bubble" id="bubble-Carl"></div>
      <div class="face">🍳</div>
      <div class="name">Carl</div>
      <div class="status">💭</div>
    </div>
  </section>

  <aside>
    <h2>對話紀錄</h2>
    <div id="log"></div>
    <footer>
      <span>Alex=qwen36 · Bella=gemma4 · Carl=nemotron</span>
      <span id="stats">回合: 0</span>
    </footer>
  </aside>
</main>

<script>
const conn = document.getElementById("conn");
const connText = document.getElementById("conn-text");
const log = document.getElementById("log");
const stats = document.getElementById("stats");
const NAMES = ["Alex", "Bella", "Carl"];

let rounds = 0;
let ws = null;
let reconnectTimer = null;

function setConn(state, text) {
  conn.className = "conn " + state;
  connText.textContent = text;
}

function clearAllThinking() {
  for (const n of NAMES) {
    document.getElementById("ag-" + n).classList.remove("thinking", "speaking");
  }
}

function setThinking(candidates) {
  clearAllThinking();
  for (const n of candidates) {
    const el = document.getElementById("ag-" + n);
    if (el) el.classList.add("thinking");
  }
}

function speak(speaker, text, elapsedMs) {
  clearAllThinking();
  if (speaker === "system") {
    addLog("system", text, elapsedMs);
    return;
  }
  const el = document.getElementById("ag-" + speaker);
  const bubble = document.getElementById("bubble-" + speaker);
  if (!el || !bubble) return;
  bubble.textContent = "";
  el.classList.add("speaking");
  // 打字機效果
  let i = 0;
  const tick = () => {
    bubble.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(tick, 35);
  };
  tick();
  addLog(speaker, text, elapsedMs);
  rounds++;
  stats.textContent = "回合: " + rounds;
}

function addLog(speaker, text, elapsedMs) {
  const div = document.createElement("div");
  div.className = "entry";
  const meta = elapsedMs ? `<span class="meta">${(elapsedMs/1000).toFixed(1)}s</span>` : "";
  div.innerHTML = `<span class="who who-${speaker}">${speaker}</span>${meta}<div class="text"></div>`;
  div.querySelector(".text").textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  setConn("down", "連線中…");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => setConn("up", "已連線");
  ws.onclose = () => {
    setConn("down", "斷線，5 秒後重連…");
    clearAllThinking();
    reconnectTimer = setTimeout(connect, 5000);
  };
  ws.onerror = () => setConn("down", "連線錯誤");
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "hello") {
      // ignore for now，使用前端固定的 3 個角色
    } else if (m.type === "thinking") {
      setThinking(m.candidates || NAMES);
    } else if (m.type === "say") {
      speak(m.speaker, m.text, m.elapsed_ms);
    } else if (m.type === "error") {
      addLog("system", "錯誤: " + m.message);
    }
  };
}

connect();
</script>
</body>
</html>
