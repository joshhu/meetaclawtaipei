<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Summit 2026 - 三巨頭舞台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #0a0a14;
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    padding: 10px 24px;
    background: linear-gradient(180deg, #1a0f0f, #0a0a14);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #c9a227;
    box-shadow: 0 2px 12px rgba(201,162,39,.25);
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f4d35e;
    text-shadow: 0 0 8px rgba(244,211,94,.4);
  }
  .conn {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #aaa;
  }
  .conn .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #888; transition: background .3s;
  }
  .conn.up .dot { background: #4caf50; box-shadow: 0 0 10px #4caf50; }
  .conn.down .dot { background: #f44336; }

  main {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 12px;
    padding: 12px;
    height: calc(100vh - 48px);
  }

  /* ============ 舞台 ============ */
  .stage {
    position: relative;
    background:
      /* 上方背景 (深紅幕) */
      linear-gradient(180deg,
        #2a0a0a 0%,
        #5a1010 5%,
        #8b1a1a 18%,
        #1a0808 55%,    /* 舞台後方陰影 */
        #2a1a08 60%,
        #4a2818 70%,
        #6e3e1e 100%);  /* 舞台木地板 */
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    min-height: 600px;
  }

  /* 紅幕 - 左右 */
  .stage::before, .stage::after {
    content: "";
    position: absolute;
    top: 0; bottom: 35%;
    width: 90px;
    background:
      repeating-linear-gradient(90deg,
        #4a0a0a 0px,
        #8b1a1a 8px,
        #6a1010 16px,
        #4a0a0a 24px);
    box-shadow: inset -10px 0 20px rgba(0,0,0,.5);
    z-index: 2;
  }
  .stage::before { left: 0; border-radius: 0 20px 80px 0; }
  .stage::after { right: 0; transform: scaleX(-1); border-radius: 0 20px 80px 0; }

  /* 舞台 backdrop banner */
  .backdrop {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #1a1a2a, #0a0a14);
    border: 2px solid #c9a227;
    border-radius: 8px;
    padding: 10px 30px;
    box-shadow: 0 0 30px rgba(201,162,39,.4);
    z-index: 1;
  }
  .backdrop h2 {
    font-size: 16px;
    color: #f4d35e;
    letter-spacing: 2px;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 0 6px rgba(244,211,94,.5);
  }
  .backdrop .sub {
    font-size: 10px;
    color: #aaa;
    text-align: center;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  /* 舞台燈光 - 從上方往下打 */
  .spotlights {
    position: absolute;
    top: 18%;
    left: 0; right: 0;
    height: 50%;
    pointer-events: none;
  }
  .spot {
    position: absolute;
    top: 0;
    width: 200px;
    height: 100%;
    background: radial-gradient(ellipse at top,
      rgba(255,240,180,.18) 0%,
      rgba(255,240,180,.08) 30%,
      transparent 70%);
    transform-origin: top center;
  }
  .spot-1 { left: 18%; transform: skewX(8deg); }
  .spot-2 { left: 50%; transform: translateX(-50%); }
  .spot-3 { right: 18%; transform: skewX(-8deg); }

  /* 舞台地板表面光線 */
  .floor-glow {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(255,200,100,.05) 40%,
      rgba(255,200,100,.12) 100%);
    pointer-events: none;
  }

  /* ============ 講者 ============ */
  .speaker {
    position: absolute;
    width: 280px;
    text-align: center;
    z-index: 3;
    transition: transform .4s ease;
  }
  /* 三人位置：兩側往外推、中間往前下一點製造層次 */
  #sp-Trump  { bottom: 8%; left: 2%; }
  #sp-Obama  { bottom: 3%; left: 50%; transform: translateX(-50%); }
  #sp-Jensen { bottom: 8%; right: 2%; }

  .speaker .avatar-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #f4d35e;
    box-shadow: 0 8px 28px rgba(0,0,0,.7), 0 0 28px rgba(244,211,94,.25);
    background: #2a2a3a;
    filter: grayscale(50%) brightness(0.7);
    transition: all .35s ease;
  }
  .speaker.thinking .avatar-wrap {
    animation: bob 1.8s ease-in-out infinite;
  }
  .speaker.speaking .avatar-wrap {
    filter: none;
    transform: scale(1.08);
    border-color: #ff5252;
    box-shadow: 0 0 55px rgba(255,82,82,.7), 0 10px 30px rgba(0,0,0,.7);
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .speaker .avatar {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .speaker .name {
    margin-top: 14px;
    font-size: 24px;
    color: #f4d35e;
    font-weight: 700;
    background: rgba(0,0,0,.75);
    border-radius: 18px;
    padding: 6px 24px;
    display: inline-block;
    letter-spacing: 2px;
    border: 2px solid rgba(244,211,94,.4);
    text-shadow: 0 0 8px rgba(244,211,94,.3);
  }
  .speaker .who-model {
    margin-top: 6px;
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }

  /* speech bubble */
  .bubble {
    position: absolute;
    bottom: calc(100% + 22px);
    left: 50%;
    transform: translateX(-50%);
    min-width: 240px;
    max-width: 440px;
    background: #fff;
    color: #1a1a1a;
    padding: 18px 24px;
    border-radius: 20px;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.55;
    box-shadow: 0 12px 36px rgba(0,0,0,.55), 0 0 24px rgba(255,255,255,.1);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 10;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: left;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 14px solid #fff;
  }
  .speaker.speaking .bubble { opacity: 1; }

  /* ============ 右側對話紀錄 ============ */
  aside {
    background: #15151f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  aside h2 {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #f4d35e;
    background: linear-gradient(180deg, #1a1a2a, #15151f);
    border-bottom: 1px solid rgba(244,211,94,.2);
    letter-spacing: 1px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  #log .entry {
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeIn .4s forwards;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(255,255,255,.08);
  }
  #log .entry .who {
    font-weight: 700;
    margin-right: 6px;
    letter-spacing: 0.5px;
  }
  #log .entry .meta {
    color: #555;
    font-size: 11px;
    margin-left: 6px;
  }
  #log .entry .text {
    color: #ddd;
    margin-top: 4px;
  }
  .who-Trump  { color: #ff6b6b; }
  .who-Jensen { color: #51cf66; }
  .who-Obama  { color: #74c0fc; }
  .who-system { color: #f44336; }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  footer {
    padding: 8px 16px;
    background: #0a0a14;
    border-top: 1px solid #2a2a3a;
    font-size: 11px;
    color: #666;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 1200px) {
    main { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 600px; }
    .speaker { width: 200px; }
    .speaker .avatar-wrap { width: 180px; height: 180px; }
    .speaker .name { font-size: 18px; padding: 4px 18px; }
    #sp-Trump  { left: 2%; }
    #sp-Jensen { right: 2%; }
  }

  /* ============ Topic bar (v3) ============ */
  .topic-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #1a1a2a, #15151f);
    border-bottom: 1px solid rgba(244,211,94,.2);
  }
  .topic-bar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #3a3a4a;
    background: #0a0a14;
    color: #eee;
    font-size: 14px;
    font-family: inherit;
  }
  .topic-bar input:focus { outline: 2px solid #f4d35e; }
  .topic-bar button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(180deg, #f4d35e, #c9a227);
    color: #1a0808;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .topic-bar button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(244,211,94,.4); }
  .topic-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .topic-bar button.stop-btn {
    background: linear-gradient(180deg, #ff8a80, #c62828);
    color: #fff;
  }
  .topic-bar button.stop-btn:hover { box-shadow: 0 4px 12px rgba(255,82,82,.4); }
  #topic-current {
    color: #f4d35e;
    font-size: 13px;
    font-weight: 600;
    margin-left: 8px;
  }
  #topic-current::before { content: "📌 "; }

  /* ============ Search indicator (v3) ============ */
  .search-tag {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2a;
    border: 2px solid #51cf66;
    color: #b3ffce;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(0,0,0,.5), 0 0 16px rgba(81,207,102,.4);
    opacity: 0;
    pointer-events: none;
    z-index: 11;
    white-space: nowrap;
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity .25s;
  }
  .speaker.searching .search-tag { opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(81,207,102,.4); }
    50% { box-shadow: 0 0 28px rgba(81,207,102,.8); }
  }
  .who-search { color: #51cf66; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>🎙️ AI SUMMIT 2026 — 三巨頭舞台對談 (with web search)</h1>
  <div class="conn down" id="conn"><span class="dot"></span><span id="conn-text">連線中…</span></div>
</header>

<div class="topic-bar">
  <input id="topic-input" placeholder="輸入今日論壇主題（例：DeepSeek V4 為什麼這麼強？ / Llama 5 最新進展 / NVIDIA Rubin 規格）" autocomplete="off"/>
  <button id="topic-btn">開始討論</button>
  <button id="stop-btn" class="stop-btn">⏹ 停止</button>
  <span id="topic-current"></span>
</div>

<main>
  <section class="stage" id="stage">
    <!-- backdrop banner -->
    <div class="backdrop">
      <h2>AI &amp; THE NEXT DECADE</h2>
      <div class="sub">— DGX Spark Powered · Taipei —</div>
    </div>

    <!-- 燈光 -->
    <div class="spotlights">
      <div class="spot spot-1"></div>
      <div class="spot spot-2"></div>
      <div class="spot spot-3"></div>
    </div>
    <div class="floor-glow"></div>

    <!-- 三位講者 -->
    <div class="speaker" id="sp-Trump">
      <div class="bubble" id="bubble-Trump"></div>
      <div class="search-tag" id="search-Trump"></div>
      <div class="avatar-wrap"><img class="avatar" src="/static/trump.jpg" alt="Trump"></div>
      <div class="name">Trump</div>
      <div class="who-model">qwen36 · 27B · 🔍</div>
    </div>
    <div class="speaker" id="sp-Obama">
      <div class="bubble" id="bubble-Obama"></div>
      <div class="search-tag" id="search-Obama"></div>
      <div class="avatar-wrap"><img class="avatar" src="/static/obama.jpg" alt="Obama"></div>
      <div class="name">Obama</div>
      <div class="who-model">gemma4 · 31B · 不搜尋</div>
    </div>
    <div class="speaker" id="sp-Jensen">
      <div class="bubble" id="bubble-Jensen"></div>
      <div class="search-tag" id="search-Jensen"></div>
      <div class="avatar-wrap"><img class="avatar" src="/static/jensen.jpg" alt="Jensen"></div>
      <div class="name">Jensen Huang</div>
      <div class="who-model">nemotron · 12B · 🔍</div>
    </div>
  </section>

  <aside>
    <h2>🎤 對談實況</h2>
    <div id="log"></div>
    <footer>
      <span>3 LLMs 同時思考、最快出口先說</span>
      <span id="stats">第 0 輪</span>
    </footer>
  </aside>
</main>

<script>
const conn = document.getElementById("conn");
const connText = document.getElementById("conn-text");
const log = document.getElementById("log");
const stats = document.getElementById("stats");
const NAMES = ["Trump", "Obama", "Jensen"];

let rounds = 0;
let ws = null;

function setConn(state, text) {
  conn.className = "conn " + state;
  connText.textContent = text;
}

function clearAllStates() {
  for (const n of NAMES) {
    const el = document.getElementById("sp-" + n);
    if (el) el.classList.remove("thinking", "speaking", "searching");
  }
}

function setSearching(speaker, query) {
  const el = document.getElementById("sp-" + speaker);
  const tag = document.getElementById("search-" + speaker);
  if (!el || !tag) return;
  tag.textContent = "🔍 搜尋: " + (query || "");
  el.classList.add("searching");
  addLog(speaker, "🔍 搜尋: " + query, null, true);
}

function clearSearching(speaker) {
  const el = document.getElementById("sp-" + speaker);
  if (el) el.classList.remove("searching");
}

// 音檔播放 — 收到 base64 → blob → Audio.play()
let currentAudio = null;
let currentUrl = null;
function playAudio(speaker, b64, fmt) {
  try {
    if (currentAudio) {
      currentAudio.pause();
      try { currentAudio.src = ""; } catch (_) {}
    }
    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }

    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const mime = fmt === "wav" ? "audio/wav" : "audio/mpeg";
    const blob = new Blob([bytes], {type: mime});
    const url = URL.createObjectURL(blob);
    currentUrl = url;
    console.log(`[audio] ${speaker} ${bytes.length}B header=${bytes[0]},${bytes[1]},${bytes[2]},${bytes[3]} mime=${mime} url=${url}`);
    const audio = new Audio(url);
    audio.volume = 0.95;
    audio.onloadedmetadata = () => console.log(`[audio] ${speaker} loadedmetadata, dur=${audio.duration}s`);
    audio.oncanplay = () => console.log(`[audio] ${speaker} canplay`);
    audio.onended = () => { console.log(`[audio] ${speaker} ended`); URL.revokeObjectURL(url); };
    audio.onerror = (ev) => {
      const err = audio.error || {};
      console.error(`[audio] ${speaker} ERROR code=${err.code} message=${err.message} networkState=${audio.networkState} readyState=${audio.readyState}`);
    };
    audio.play()
      .then(() => console.log(`[audio] ${speaker} play() resolved`))
      .catch(e => console.warn(`[audio] ${speaker} play() rejected:`, e.name, e.message));
    currentAudio = audio;
  } catch (e) {
    console.error("playAudio failed:", e);
  }
}

function setThinking(candidates) {
  clearAllStates();
  for (const n of candidates) {
    const el = document.getElementById("sp-" + n);
    if (el) el.classList.add("thinking");
  }
}

function speak(speaker, text, elapsedMs) {
  clearAllStates();
  if (speaker === "system") {
    addLog("system", text, elapsedMs);
    return;
  }
  const el = document.getElementById("sp-" + speaker);
  const bubble = document.getElementById("bubble-" + speaker);
  if (!el || !bubble) return;
  bubble.textContent = "";
  el.classList.add("speaking");
  let i = 0;
  const tick = () => {
    bubble.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(tick, 40);
  };
  tick();
  addLog(speaker, text, elapsedMs);
  rounds++;
  stats.textContent = "第 " + rounds + " 輪";
}

function addLog(speaker, text, elapsedMs, isSearch) {
  const div = document.createElement("div");
  div.className = "entry";
  const meta = elapsedMs ? `<span class="meta">${(elapsedMs/1000).toFixed(1)}s</span>` : "";
  const whoClass = isSearch ? "who-search" : ("who-" + speaker);
  div.innerHTML = `<span class="who ${whoClass}">${speaker}</span>${meta}<div class="text"></div>`;
  div.querySelector(".text").textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  setConn("down", "連線中…");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => setConn("up", "已連線");
  ws.onclose = () => {
    setConn("down", "斷線，5 秒後重連…");
    clearAllStates();
    setTimeout(connect, 5000);
  };
  ws.onerror = () => setConn("down", "連線錯誤");
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "topic_set") {
      document.getElementById("topic-current").textContent = m.topic;
      log.innerHTML = "";
      rounds = 0;
      stats.textContent = "第 0 輪";
    } else if (m.type === "audio") {
      playAudio(m.speaker, m.audio_b64, m.format || "wav");
    } else if (m.type === "stopped") {
      clearAllStates();
      addLog("system", "對話已停止。輸入新主題重新開始。");
    } else if (m.type === "searching") {
      setSearching(m.speaker, m.query);
    } else if (m.type === "search_done") {
      clearSearching(m.speaker);
    } else if (m.type === "thinking") {
      setThinking(m.candidates || NAMES);
    } else if (m.type === "say") {
      speak(m.speaker, m.text, m.elapsed_ms);
    } else if (m.type === "error") {
      addLog("system", "錯誤: " + m.message);
    }
  };
}

connect();

// ---- Topic input + stop ----
const topicInput = document.getElementById("topic-input");
const topicBtn = document.getElementById("topic-btn");
const stopBtn = document.getElementById("stop-btn");
function submitTopic() {
  const t = topicInput.value.trim();
  if (!t || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: "set_topic", topic: t}));
}
function stopChat() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: "stop"}));
}
topicBtn.addEventListener("click", submitTopic);
stopBtn.addEventListener("click", stopChat);
topicInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitTopic();
});
</script>
</body>
</html>
